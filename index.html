<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1B4C">
<title>Terrazo di Dante — Portal de Moradores</title>
<style>
  /* LOADING IMEDIATO — CSS crítico inline, sem dependências externas */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d0d0d; }
  iframe { width: 100%; height: 100vh; height: 100dvh; border: none; display: block; opacity: 0; transition: opacity .5s ease; }
  iframe.ready { opacity: 1; }

  #ghLoading {
    position: fixed; inset: 0; background: #0d0d0d; z-index: 9999;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    transition: opacity .5s ease, visibility .5s ease;
  }
  #ghLoading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .gh-logo {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, #2952CC, #9B3DB8);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 26px; letter-spacing: 1px;
    margin-bottom: 24px; box-shadow: 0 8px 32px rgba(155,61,184,0.35);
    animation: ghPulse 2s ease-in-out infinite;
  }
  @keyframes ghPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(155,61,184,0.35); }
    50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(155,61,184,0.5); }
  }
  .gh-title { font-size: 20px; font-weight: 700; color: #f0f0f0; margin: 0 0 6px; text-align: center; }
  .gh-subtitle { font-size: 14px; color: #8888a0; margin: 0 0 28px; text-align: center; max-width: 280px; line-height: 1.5; }
  .gh-spinner {
    width: 44px; height: 44px; border: 3px solid #262626; border-top-color: #2952CC;
    border-radius: 50%; animation: ghSpin 1s linear infinite; margin-bottom: 24px;
  }
  @keyframes ghSpin { to { transform: rotate(360deg); } }
  .gh-progress {
    width: 200px; height: 4px; background: #262626; border-radius: 2px; overflow: hidden; margin-bottom: 16px;
  }
  .gh-progress-bar {
    height: 100%; background: linear-gradient(90deg, #2952CC, #9B3DB8);
    width: 0%; border-radius: 2px; animation: ghLoad 2.2s ease-in-out infinite;
  }
  @keyframes ghLoad {
    0% { width: 0%; margin-left: 0%; opacity: 1; }
    50% { width: 70%; margin-left: 15%; opacity: 1; }
    100% { width: 0%; margin-left: 100%; opacity: 0; }
  }
  .gh-step { font-size: 13px; color: #5a5a7a; min-height: 20px; text-align: center; }
  .gh-hint { font-size: 12px; color: #525252; text-align: center; margin-top: 16px; line-height: 1.5; max-width: 260px; }
  .gh-error {
    display: none; margin-top: 20px; padding: 12px 16px; background: rgba(217,48,37,0.1);
    border: 1px solid rgba(217,48,37,0.2); border-radius: 10px; color: #D93025;
    font-size: 13px; text-align: center; max-width: 280px; line-height: 1.5;
  }
  .gh-error.visible { display: block; }
  .gh-retry {
    margin-top: 12px; padding: 10px 20px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #2952CC, #243B80); color: #fff;
    font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(41,82,204,0.25);
  }
  .gh-retry:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(41,82,204,0.35); }
</style>
<base target="_blank">
</head>
<body>

<!-- ========== TELA DE CARREGAMENTO IMEDIATA ========== -->
<div id="ghLoading">
  <div class="gh-logo">TZ</div>
  <p class="gh-title">Terrazo di Dante</p>
  <p class="gh-subtitle">Portal de Moradores</p>
  <div class="gh-spinner"></div>
  <div class="gh-progress"><div class="gh-progress-bar"></div></div>
  <p class="gh-step" id="ghStep">Iniciando...</p>
  <p class="gh-hint">Na primeira vez pode levar alguns segundos.<br>Depois fica instantâneo.</p>
  <div class="gh-error" id="ghError">
    <strong>O portal está demorando mais que o esperado.</strong><br>
    Verifique sua conexão com a internet e tente novamente.
    <br><button class="gh-retry" onclick="location.reload()">Tentar novamente</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyY6ePkEm6NBU3jL9m7HTBz6tCNkMmEBB3zJuPXGry5rd8gEdY4lAWyXIH4XLqHSOXp/exec';

  // Mensagens de etapa rotativas (feedback contínuo para usuários idosos)
  var steps = [
    'Conectando ao servidor...',
    'Verificando sua sessão...',
    'Carregando dados do condomínio...',
    'Organizando moradores...',
    'Quase pronto...'
  ];
  var stepIdx = 0;
  var stepEl = document.getElementById('ghStep');
  var stepInterval = setInterval(function() {
    stepIdx = (stepIdx + 1) % steps.length;
    if (stepEl) stepEl.textContent = steps[stepIdx];
  }, 2500);

  // Timeout de segurança: se em 90s o iframe não carregar, mostra erro amigável
  var errorTimeout = setTimeout(function() {
    var err = document.getElementById('ghError');
    if (err && !document.getElementById('ghLoading').classList.contains('hidden')) {
      err.classList.add('visible');
      if (stepEl) stepEl.textContent = 'Tempo esgotado';
    }
  }, 90000);

  // Monta a URL do iframe preservando parâmetros da URL e sessão salva
  var params = window.location.search;
  var session = localStorage.getItem('terrazo_session') || '';

  var iframeSrc;
  if (params && params.indexOf('action=auth') >= 0) {
    iframeSrc = APPS_SCRIPT_URL + params;
  } else if (session) {
    iframeSrc = APPS_SCRIPT_URL + '?session=' + encodeURIComponent(session);
  } else {
    iframeSrc = APPS_SCRIPT_URL;
  }

  // Cria o iframe
  var iframe = document.createElement('iframe');
  iframe.src = iframeSrc;
  iframe.allow = 'clipboard-write';
  iframe.onload = function() {
    clearTimeout(errorTimeout);
    clearInterval(stepInterval);
    iframe.classList.add('ready');
    var loading = document.getElementById('ghLoading');
    if (loading) loading.classList.add('hidden');
  };
  document.body.appendChild(iframe);

  // Limpa query string da URL para não poluir o histórico (magic links, etc.)
  if (params) {
    try {
      history.replaceState(null, '', window.location.pathname);
    } catch(e) {}
  }

  // Escuta mensagens do iframe (sessão / logout)
  window.addEventListener('message', function(e) {
    try {
      var data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'terrazo_session' && data.token) {
        localStorage.setItem('terrazo_session', data.token);
      }
      if (data.type === 'terrazo_logout') {
        localStorage.removeItem('terrazo_session');
      }
    } catch(err) {}
  });
})();
</script>

</body>
</html>
